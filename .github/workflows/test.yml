name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TYPE_DB_POSTGRES_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=postgres'
      TYPE_DB_POSTGRES_USER: postgres
      TYPE_DB_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_pgsql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit tests --testdox
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpa src
